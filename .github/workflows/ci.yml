name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Runs on:
#   • push to main only  — CD handles dev-release/staging (has own validate job)
#   • PRs targeting dev-release, staging, main — gate before merge
#
# Job graph
# ─────────────────────────────────────────────────────────────────────────────
#
#   ┌──────┐   ┌──────┐   ┌──────────────────┐
#   │ lint │   │ test │   │ dependency-review │ ← PR only
#   └──┬───┘   └──┬───┘   └──────────────────┘
#      │          │
#      └────┬─────┘
#           ▼
#       ┌────────┐
#       │ build  │  uploads debug APK artifact
#       └────────┘
#
# lint and test run in parallel.
# build only starts when BOTH pass — no point building broken code.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [dev-release, staging, main]

# Cancel in-progress runs for PRs; never cancel a push to release branches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.x'
  JAVA_VERSION: '17'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1 · lint  (~2 min)
  # Fast fail: catches format/analysis issues before slower jobs run.
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2 · test  (~3 min, parallel with lint)
  # Runs unit tests, prints coverage summary, uploads lcov artifact.
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test --coverage

      - name: Coverage summary
        run: |
          sudo apt-get install -y lcov -q 2>/dev/null || true
          if command -v lcov &>/dev/null; then
            lcov --summary coverage/lcov.info
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov-${{ github.sha }}
          path: coverage/lcov.info
          retention-days: 14

      - name: Add coverage to job summary
        run: |
          echo "## Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if command -v lcov &>/dev/null; then
            lcov --summary coverage/lcov.info 2>&1 \
              | grep -E 'lines|functions|branches' \
              | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_(lcov unavailable — see artifact)_" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3 · build  (~3 min cached, gates on lint + test)
  # Builds debug APK (downloadable artifact) + release AAB smoke to catch
  # ProGuard / R8 issues before the CD pipeline runs.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build (smoke)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Build release AAB (smoke — unsigned)
        run: flutter build appbundle --release

      - name: Build summary
        run: |
          APK=$(du -sh build/app/outputs/flutter-apk/app-debug.apk | cut -f1)
          AAB=$(du -sh build/app/outputs/bundle/release/app-release.aab | cut -f1)
          echo "## Build Output" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artefact | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| debug APK (artifact, 14d) | \`$APK\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| release AAB (smoke)       | \`$AAB\` |" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4 · dependency-review  (~1 min, PR only, parallel)
  # Fails if a newly added / updated dependency has a HIGH or CRITICAL CVE.
  # ─────────────────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
