name: Promote — Android Play Store

# ─────────────────────────────────────────────────────────────────────────────
# Manual override untuk promosi track tanpa rebuild.
#
# Dengan alur branch-based, promosi biasanya terjadi otomatis via merge:
#   dev-release → staging  →  alpha (closed testing)
#   staging     → main     →  production
#
# Workflow ini dipakai untuk kasus khusus:
#   • Mempercepat rollout production (naik dari 10% ke 50% / 100%)
#   • Rollback ke track sebelumnya jika ada masalah
#   • Bypass branch flow untuk hotfix darurat
#
# Required secrets: GOOGLE_PLAY_JSON (sama dengan cd-android.yml)
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      from_track:
        description: 'Dari track mana'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta]

      to_track:
        description: 'Ke track mana'
        required: true
        default: alpha
        type: choice
        options: [alpha, beta, production]

      rollout_percentage:
        description: 'Rollout % untuk production (1–100, abaikan untuk track lain)'
        required: false
        default: '100'

env:
  PACKAGE_NAME: com.labs.quran

jobs:
  promote:
    name: '${{ inputs.from_track }} → ${{ inputs.to_track }}'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compute rollout fraction
        id: rollout
        run: |
          if [[ "${{ inputs.to_track }}" == "production" ]]; then
            PCT="${{ inputs.rollout_percentage }}"
            PCT=$(( PCT < 1   ? 1   : PCT ))
            PCT=$(( PCT > 100 ? 100 : PCT ))
            echo "fraction=$(echo "scale=2; $PCT/100" | bc)" >> "$GITHUB_OUTPUT"
            echo "status=inProgress" >> "$GITHUB_OUTPUT"
          else
            echo "fraction=1.0"   >> "$GITHUB_OUTPUT"
            echo "status=completed" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote release on Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          track: ${{ inputs.to_track }}
          fromTrack: ${{ inputs.from_track }}
          status: ${{ steps.rollout.outputs.status }}
          userFraction: ${{ steps.rollout.outputs.fraction }}

      - name: Job summary
        run: |
          echo "## Promosi Selesai ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dari** | \`${{ inputs.from_track }}\` |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ke** | \`${{ inputs.to_track }}\` |" \
            >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.to_track }}" == "production" ]]; then
            echo "| **Rollout** | ${{ inputs.rollout_percentage }}% |" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
