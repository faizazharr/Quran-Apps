name: CD — Android

# ─────────────────────────────────────────────────────────────────────────────
# Branch → Play Store track mapping
# ─────────────────────────────────────────────────────────────────────────────
#
#   dev-release  →  Internal Testing   (tim internal, langsung available)
#   staging      →  Closed Testing     (alpha, untuk QA / tester terpilih)
#   main         →  Production         (staged rollout 10% → 100%)
#
# Flow kerja:
#   feature/* → PR → dev-release → [auto: internal]
#                 → PR → staging  → [auto: closed testing]
#                           → PR → main → [auto: production 10%]
#
# Build number di-inject dari github.run_number sehingga setiap push
# menghasilkan versionCode yang unik dan selalu bertambah.
# Version name diambil dari pubspec.yaml (bagian sebelum '+').
#
# Required secrets (GitHub → Settings → Secrets → Actions)
# ─────────────────────────────────────────────────────────
#   KEYSTORE_BASE64   base64-encoded upload keystore (.jks)
#                     → base64 -i android/upload-keystore.jks | pbcopy
#   STORE_PASSWORD    storePassword dari key.properties
#   KEY_PASSWORD      keyPassword dari key.properties
#   KEY_ALIAS         keyAlias (biasanya "upload")
#   GOOGLE_PLAY_JSON  service account JSON dari Play Developer API
#                     → Play Console → Setup → API access → service account
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - dev-release
      - staging
      - main

# Jangan pernah cancel CD yang sedang berjalan — biarkan selesai.
concurrency:
  group: cd-android-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.x'
  JAVA_VERSION: '17'
  PACKAGE_NAME: com.labs.quran

jobs:
  # ─── Validate ──────────────────────────────────────────────────────────────
  # Safety net: format + analyze + test sebelum build dimulai.
  # (Branch protection memastikan CI sudah hijau sebelum merge, tapi
  # validasi ini melindungi dari push langsung ke release branch.)
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  # ─── Build · Sign · Deploy ─────────────────────────────────────────────────
  deploy:
    name: Build · Sign · Deploy
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: flutter pub get

      # ── Signing ─────────────────────────────────────────────────────────────
      # Decode to project root (same path as local dev) so storeFile resolves
      # identically: ../../upload-keystore.p12 from android/app/ = project root.
      # Using env var avoids inline ${{ }} substitution edge-cases with long
      # multi-line secrets.
      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > upload-keystore.p12

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../../upload-keystore.p12
          EOF

      - name: Verify keystore readable
        run: |
          keytool -list -keystore upload-keystore.p12 \
            -storetype PKCS12 -storepass "${{ secrets.STORE_PASSWORD }}" \
            2>&1 | head -6

      # ── Tentukan track berdasarkan branch ────────────────────────────────────
      - name: Resolve release track
        id: track
        run: |
          case "${{ github.ref_name }}" in
            main)
              echo "track=production"                    >> "$GITHUB_OUTPUT"
              echo "status=inProgress"                   >> "$GITHUB_OUTPUT"
              echo "rollout=0.10"                        >> "$GITHUB_OUTPUT"
              echo "label=🚀 Production (10% rollout)"  >> "$GITHUB_OUTPUT"
              echo "prerelease=false"                    >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "track=alpha"                         >> "$GITHUB_OUTPUT"
              echo "status=completed"                    >> "$GITHUB_OUTPUT"
              echo "rollout=1.0"                         >> "$GITHUB_OUTPUT"
              echo "label=🧪 Closed Testing (alpha)"    >> "$GITHUB_OUTPUT"
              echo "prerelease=true"                     >> "$GITHUB_OUTPUT"
              ;;
            dev-release)
              echo "track=internal"                      >> "$GITHUB_OUTPUT"
              echo "status=completed"                    >> "$GITHUB_OUTPUT"
              echo "rollout=1.0"                         >> "$GITHUB_OUTPUT"
              echo "label=🔧 Internal Testing"           >> "$GITHUB_OUTPUT"
              echo "prerelease=true"                     >> "$GITHUB_OUTPUT"
              ;;
          esac

      # ── Versi ────────────────────────────────────────────────────────────────
      # version name  → dari pubspec.yaml (e.g. "1.2.0")
      # version code  → github.run_number (selalu naik, unik per repo)
      - name: Extract version
        id: version
        run: |
          NAME=$(grep '^version:' pubspec.yaml \
            | awk '{print $2}' | cut -d'+' -f1)
          echo "name=$NAME"                         >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}"      >> "$GITHUB_OUTPUT"
          echo "full=$NAME+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build release AAB
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"

      # Simpan AAB 30 hari — berguna untuk investigasi jika ada crash report.
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ github.ref_name }}-${{ steps.version.outputs.full }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── Deploy ke Play Store ─────────────────────────────────────────────────
      # secrets context tidak bisa dipakai di if:, gunakan step output sebagai gate.
      - name: Check Play Store config
        id: play_check
        run: |
          if [ -n "${{ secrets.GOOGLE_PLAY_JSON }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy → Play Store (${{ steps.track.outputs.track }})
        if: steps.play_check.outputs.ready == 'true'
        id: deploy
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ steps.track.outputs.track }}
          status: ${{ steps.track.outputs.status }}
          userFraction: ${{ steps.track.outputs.rollout }}
          releaseName: ${{ steps.version.outputs.full }}

      - name: Verify deploy output
        if: steps.play_check.outputs.ready == 'true'
        run: |
          echo "Internal version code: ${{ steps.deploy.outputs.internalVersionCode }}"
          echo "Release name: ${{ steps.version.outputs.full }}"

      # ── GitHub Release (staging dan main saja) ───────────────────────────────
      # dev-release tidak membuat GitHub Release — terlalu noisy.
      - name: Create GitHub Release
        if: github.ref_name == 'main' || github.ref_name == 'staging'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.full }}
          name: v${{ steps.version.outputs.name }} (${{ github.ref_name }})
          files: build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.track.outputs.prerelease == 'true' }}

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Job summary
        run: |
          AAB=$(du -sh \
            build/app/outputs/bundle/release/app-release.aab | cut -f1)
          echo "## Deployment Complete ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Track** | ${{ steps.track.outputs.label }} |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`${{ steps.version.outputs.full }}\` |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| **AAB size** | \`$AAB\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ Production rollout at **10%**. " \
              "Naikkan ke 100% dari Play Console setelah monitoring." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
